name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npx tsc --noEmit
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npx eslint . --max-warnings=10 || npm run lint || true
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm run test:unit
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npx playwright install chromium chromium-headless-shell
      - run: npm run build
      - run: |
          nohup env PORT=3000 npx next start > /tmp/next.log 2>&1 &
          for i in {1..45}; do curl -sf http://localhost:3000/gpu/h100-sxm5 && echo up $i && break; sleep 2; done
          npx playwright test --reporter=list
